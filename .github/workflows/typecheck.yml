name: typecheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript type check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install system libs for native modules
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev libsecret-1-dev libxkbfile-dev

      - name: Install dependencies
        run: npm ci
        env:
          VSCODE_SKIP_NODE_VERSION_CHECK: "1"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
          PUPPETEER_SKIP_DOWNLOAD: "1"

      - name: Run native TS type check
        run: npm run compile-check-ts-native
