name: test-browser

# Manual / on-demand only. The browser test suite has 8 known regressions
# from the bulk dep update (5 in Markdown Katex Support, 3 in
# DefaultSettings group ordering); until those are triaged, this workflow
# is not wired to push/pull_request so it does not red-mark the main
# branch. Trigger it from the Actions tab when investigating.

on:
  workflow_dispatch:

concurrency:
  group: test-browser-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
  PUPPETEER_SKIP_DOWNLOAD: "1"

jobs:
  build:
    name: build (gulp compile)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install system libs for native modules
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev libsecret-1-dev libxkbfile-dev

      - name: Install dependencies
        run: npm ci

      - name: Compile (gulp)
        run: npm run compile

      - name: Upload compiled out/
        uses: actions/upload-artifact@v4
        with:
          name: build-out
          path: |
            out/
            extensions/*/out/
          retention-days: 1
          if-no-files-found: error

  test-browser:
    name: tests (browser)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install system libs and xvfb
        run: sudo apt-get update && sudo apt-get install -y libkrb5-dev libsecret-1-dev libxkbfile-dev xvfb libnss3 libxss1 libasound2t64 libgbm1

      - name: Install dependencies
        run: npm ci

      - name: Download compiled out/
        uses: actions/download-artifact@v4
        with:
          name: build-out

      - name: Install playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Run browser unit tests
        run: xvfb-run --auto-servernum npm run test-browser-no-install
        env:
          NODE_OPTIONS: --max-old-space-size=8192
